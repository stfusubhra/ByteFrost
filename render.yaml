services:
  - type: web
    name: bytefrost-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    context: ./backend
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bytefrost-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bytefrost-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: POSTGRES_SERVER
        fromDatabase:
          name: bytefrost-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: bytefrost-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: bytefrost-db
          property: username
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: bytefrost-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: bytefrost-db
          property: name
  - type: redis
    name: bytefrost-redis
    plan: free
    ipAllowList: []
  - type: postgres
    name: bytefrost-db
    plan: free
    ipAllowList: []
    envVars:
      - key: POSTGRES_USER
        generateValue: true
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: bytefrost